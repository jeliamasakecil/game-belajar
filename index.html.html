<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipe Game Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8FF;--ink:#1F2A5C;--card:#fff;--blue:#4FB8F5;--yellow:#FFD23F;--pink:#FF6B8B;--mint:#3DDC97;--line:#D6E4F7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A36;--ink:#F1F5FF;--card:#222B54;--line:#34407A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A36;--ink:#F1F5FF;--card:#222B54;--line:#34407A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Baloo 2","Trebuchet MS",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 18px 32px}
h1{font-size:2rem;margin:8px 0 4px;line-height:1.1}
h2{font-size:1.5rem;margin:6px 0 14px;text-align:center;line-height:1.25}
p{margin:0 0 14px;line-height:1.45}
.sub{opacity:.75}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.menu{display:grid;gap:14px;margin-top:18px}
.mcard{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:26px;background:var(--card);box-shadow:0 5px 0 var(--line);border:3px solid var(--ink)}
.mcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mcard .ic{font-size:2.4rem;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none}
.mcard b{display:block;font-size:1.2rem}
.mcard span.d{font-size:.9rem;opacity:.75}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600}
.speak{background:var(--yellow);color:#1F2A5C;border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:20px 14px;text-align:center;min-height:130px;display:grid;place-items:center;font-size:2.6rem;line-height:1.3;margin-bottom:18px;word-break:break-word}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{height:96px;border-radius:26px;font-size:2.4rem;font-weight:700;color:#1F2A5C;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.emo{font-size:2.8rem}
.opt:nth-child(1){background:var(--blue)}.opt:nth-child(2){background:var(--yellow)}.opt:nth-child(3){background:var(--pink)}
.msg{min-height:2.2em;text-align:center;font-weight:600;font-size:1.25rem;margin-top:16px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots,.tray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.slot{width:68px;height:78px;border-radius:20px;border:4px dashed var(--ink);display:grid;place-items:center;font-size:2.4rem;font-weight:700;background:var(--bg)}
.slot.ok{border-style:solid;background:var(--mint);color:#1F2A5C}
.slot.hot{background:var(--yellow);color:#1F2A5C}
.tray{margin-top:34px;min-height:84px}
.tile{width:68px;height:78px;border-radius:20px;background:var(--blue);color:#1F2A5C;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:2.4rem;font-weight:700;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;z-index:5}
.tile.drag{cursor:grabbing;z-index:50;box-shadow:0 12px 14px rgba(0,0,0,.25);transition:none}
.tile.back{transition:transform .2s}
.stars{font-size:2rem;text-align:center;margin-top:10px;min-height:2.4rem}
.next{display:block;margin:18px auto 0;background:var(--mint);color:#1F2A5C;border:3px solid var(--ink);border-radius:999px;padding:12px 28px;font-size:1.2rem;font-weight:700;box-shadow:0 5px 0 var(--ink)}
.conf{position:fixed;top:45%;left:50%;font-size:1.8rem;pointer-events:none;z-index:99;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.shake{animation:none}}
</style>
</head>
<body>
<main>

<section id="home">
  <h1>Main &amp; Belajar 🎈</h1>
  <p class="sub">Ini prototipe untuk mencoba tiga jenis interaksi. Coba satu per satu di HP.</p>
  <div class="menu">
    <button class="mcard" data-go="count"><span class="ic" style="background:var(--blue)">🍎</span><span><b>Berhitung</b><span class="d">Sentuh tombol jawaban</span></span></button>
    <button class="mcard" data-go="letters"><span class="ic" style="background:var(--yellow)">🔤</span><span><b>Susun huruf</b><span class="d">Tarik huruf ke kotaknya</span></span></button>
    <button class="mcard" data-go="story"><span class="ic" style="background:var(--pink)">🌧️</span><span><b>Cerita &amp; nalar</b><span class="d">Soal dibacakan, pilih gambar</span></span></button>
  </div>
</section>

<section id="count" class="hidden">
  <div class="top"><button class="back" data-go="home">← Menu</button><button class="speak" id="sp-count">🔊 Baca soal</button></div>
  <h2>Ada berapa apel?</h2>
  <div class="stage" id="c-stage"></div>
  <div class="opts" id="c-opts"></div>
  <div class="msg" id="c-msg"></div>
  <div class="stars" id="c-stars"></div>
</section>

<section id="letters" class="hidden">
  <div class="top"><button class="back" data-go="home">← Menu</button><button class="speak" id="sp-let">🔊 Baca soal</button></div>
  <h2>Susun huruf jadi nama gambar ini</h2>
  <div class="stage" id="l-stage"></div>
  <div class="slots" id="l-slots"></div>
  <div class="tray" id="l-tray"></div>
  <div class="msg" id="l-msg"></div>
  <button class="next hidden" id="l-next">Kata berikutnya</button>
</section>

<section id="story" class="hidden">
  <div class="top"><button class="back" data-go="home">← Menu</button><button class="speak" id="sp-story">🔊 Baca soal</button></div>
  <h2 id="s-q"></h2>
  <div class="stage" id="s-stage"></div>
  <div class="opts" id="s-opts"></div>
  <div class="msg" id="s-msg"></div>
  <button class="next hidden" id="s-next">Soal berikutnya</button>
</section>

</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var cur='home',lastText='';

function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var ac;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var notes=ok?[523,659,784]:[220,180];notes.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.11)})}catch(e){}}
function confetti(){var e=['⭐','🎉','🎈','✨','💛'];for(var i=0;i<22;i++){var s=document.createElement('span');s.className='conf';s.textContent=e[i%5];s.style.setProperty('--x',(Math.random()*340-170)+'px');s.style.setProperty('--y',(Math.random()*-300-40)+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');document.body.appendChild(s);setTimeout(function(n){n.remove()}.bind(null,s),1000)}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(n){return Math.floor(Math.random()*n)}

function go(name){
  ['home','count','letters','story'].forEach(function(id){$('#'+id).classList.toggle('hidden',id!==name)});
  cur=name;try{speechSynthesis.cancel()}catch(e){}
  if(name==='count')newCount();
  if(name==='letters')newWord();
  if(name==='story')newStory();
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

/* ---------- 1. Berhitung ---------- */
var cAns=0,cScore=0;
function newCount(){
  cAns=1+rnd(5);
  $('#c-stage').textContent=new Array(cAns+1).join('🍎');
  var set=[cAns];while(set.length<3){var x=1+rnd(6);if(set.indexOf(x)<0)set.push(x)}
  var box=$('#c-opts');box.innerHTML='';
  shuffle(set).forEach(function(n){var b=document.createElement('button');b.className='opt';b.textContent=n;b.onclick=function(){pickCount(n,b)};box.appendChild(b)});
  $('#c-msg').textContent='';
  lastText='Ada berapa apel?';
}
function pickCount(n,b){
  if(n===cAns){beep(true);confetti();cScore++;$('#c-msg').textContent='Hebat! 🎉';$('#c-stars').textContent=new Array(Math.min(cScore,8)+1).join('⭐');setTimeout(newCount,1300)}
  else{beep(false);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#c-msg').textContent='Coba lagi ya!'}
}
$('#sp-count').onclick=function(){speak('Ada berapa apel? Hitung dulu ya.')};

/* ---------- 2. Susun huruf (tarik) ---------- */
var words=[{w:'BOLA',e:'⚽'},{w:'KUCING',e:'🐱'},{w:'APEL',e:'🍎'},{w:'IKAN',e:'🐟'},{w:'BUKU',e:'📘'}];
var wi=-1,filled=0,curWord=null;
function newWord(){
  var n;do{n=rnd(words.length)}while(n===wi);wi=n;curWord=words[n];filled=0;
  $('#l-stage').textContent=curWord.e;
  var sl=$('#l-slots'),tr=$('#l-tray');sl.innerHTML='';tr.innerHTML='';
  curWord.w.split('').forEach(function(ch,i){var s=document.createElement('div');s.className='slot';s.dataset.i=i;s.dataset.ch=ch;sl.appendChild(s)});
  shuffle(curWord.w.split('')).forEach(function(ch){var t=document.createElement('div');t.className='tile';t.textContent=ch;t.dataset.ch=ch;tr.appendChild(t);makeDrag(t)});
  $('#l-msg').textContent='Seret huruf ke kotak yang pas';
  $('#l-next').classList.add('hidden');
}
function makeDrag(t){
  var sx,sy,id;
  t.addEventListener('pointerdown',function(e){
    if(t.dataset.done)return;
    id=e.pointerId;sx=e.clientX;sy=e.clientY;t.setPointerCapture(id);
    t.classList.remove('back');t.classList.add('drag');
    speak(t.dataset.ch);
  });
  t.addEventListener('pointermove',function(e){
    if(e.pointerId!==id||!t.classList.contains('drag'))return;
    t.style.transform='translate('+(e.clientX-sx)+'px,'+(e.clientY-sy)+'px) scale(1.1)';
    t.style.pointerEvents='none';
    var el=document.elementFromPoint(e.clientX,e.clientY);t.style.pointerEvents='';
    document.querySelectorAll('.slot').forEach(function(s){s.classList.toggle('hot',s===el&&!s.classList.contains('ok'))});
  });
  function end(e){
    if(e.pointerId!==id||!t.classList.contains('drag'))return;
    t.classList.remove('drag');
    t.style.pointerEvents='none';
    var el=document.elementFromPoint(e.clientX,e.clientY);t.style.pointerEvents='';
    document.querySelectorAll('.slot').forEach(function(s){s.classList.remove('hot')});
    if(el&&el.classList.contains('slot')&&!el.classList.contains('ok')&&el.dataset.ch===t.dataset.ch){
      el.textContent=t.dataset.ch;el.classList.add('ok');t.dataset.done=1;t.style.visibility='hidden';t.style.transform='';
      filled++;beep(true);
      if(filled===curWord.w.length){confetti();$('#l-msg').textContent='Pintar! Katanya '+curWord.w+' 🎉';speak(curWord.w);$('#l-next').classList.remove('hidden')}
    }else{
      if(el&&el.classList.contains('slot')){beep(false);$('#l-msg').textContent='Belum pas, coba kotak lain'}
      t.classList.add('back');t.style.transform='';
    }
  }
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
}
$('#l-next').onclick=newWord;
$('#sp-let').onclick=function(){speak('Susun huruf menjadi nama gambar ini.')};

/* ---------- 3. Cerita & nalar ---------- */
var stories=[
  {q:'Hujan turun deras. Apa yang dibawa Ani?',s:'🌧️ 👧',o:['☂️','🕶️','🧸'],a:0},
  {q:'Adi mau gosok gigi sebelum tidur. Apa yang dipakai Adi?',s:'🌙 🦷',o:['🪥','⚽','🍟'],a:0},
  {q:'Perut Dina lapar sekali. Apa yang harus Dina lakukan?',s:'😋 🍚',o:['Makan','Tidur','Lari'],a:0}
];
var si=-1,sCur=null;
function newStory(){
  var n;do{n=rnd(stories.length)}while(n===si);si=n;sCur=stories[n];
  $('#s-q').textContent=sCur.q;$('#s-stage').textContent=sCur.s;
  var order=shuffle([0,1,2]),box=$('#s-opts');box.innerHTML='';
  order.forEach(function(i){var b=document.createElement('button');b.className='opt'+(sCur.o[i].length<3?' emo':'');b.textContent=sCur.o[i];if(sCur.o[i].length>2){b.style.fontSize='1.1rem'}b.onclick=function(){pickStory(i,b)};box.appendChild(b)});
  $('#s-msg').textContent='';$('#s-next').classList.add('hidden');
}
function pickStory(i,b){
  if(i===sCur.a){beep(true);confetti();$('#s-msg').textContent='Betul sekali! 🎉';$('#s-next').classList.remove('hidden')}
  else{beep(false);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#s-msg').textContent='Hmm, coba pikir lagi ya'}
}
$('#s-next').onclick=newStory;
$('#sp-story').onclick=function(){speak(sCur.q)};
})();
</script>
</body>
</html>
